comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true
  after_n_builds: 1

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

github_checks:
  annotations: false

# Coverage reflects product code only. The Rust coverage report (from
# cargo-llvm-cov) also instruments the integration-test harnesses under tests/;
# exclude them so the number tracks src/. bench/ is Python and never appears.
ignore:
  - "tests/**"
  - "bench/**"
