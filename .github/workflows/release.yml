name: Release

# Triggered by pushing a semver tag like `v0.1.0`. Produces cross-compiled
# binaries for macOS/Linux/Windows, uploads them to a GitHub Release, and
# (opt-in) publishes to crates.io.
#
# Required for crates.io publish:
#   - repo variable  PUBLISH_TO_CRATES_IO=true
#   - repo secret    CARGO_REGISTRY_TOKEN
# GitHub Releases require only the default GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Leave as draft until upload jobs complete; a human flips it to published.
          draft: true

  upload-binaries:
    name: Upload ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Handles cross-compilation (cross / zigbuild), packaging (.tar.gz on
      # unix, .zip on windows), and SHA256 sidecar generation in one step.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: roux
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    needs: upload-binaries
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
